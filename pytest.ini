[pytest]
# Solo se buscan tests en tests/ (evita recorrer venv/, _book/, notebooks/...).
testpaths = tests
# Un xfail que de repente pasa es un error: obliga a retirar el marcador
# cuando se corrige el defecto asociado a la tarea de la hoja de ruta.
xfail_strict = true
# Muestra al final el motivo de cada xfail, skip o fallo.
addopts = -ra
