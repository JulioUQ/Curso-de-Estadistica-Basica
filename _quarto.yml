project:
  type: book
  output-dir: _book

lang: es

book:
  title: "Estadística Básica"
  author: "Julio Úbeda Quesada"
  date: today
  page-navigation: true
  repo-url: "https://github.com/TU-USUARIO/estadistica-basica"
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - part: "Módulo 1 — Estadística Descriptiva"
      chapters:
        - notebooks/01_estadistica_descriptiva/teoria.qmd
        - notebooks/01_estadistica_descriptiva/practica.ipynb
    - part: "Módulo 2 — Probabilidad Básica"
      chapters:
        - notebooks/02_probabilidad/teoria.qmd
        - notebooks/02_probabilidad/practica.ipynb
    - part: "Módulo 3 — Distribuciones de Probabilidad"
      chapters:
        - notebooks/03_distribuciones/teoria.qmd
        - notebooks/03_distribuciones/practica.ipynb
   - part: "Módulo 4 — Inferencia Estadística"
      chapters:
        - notebooks/04_inferencia/teoria.qmd
        - notebooks/04_inferencia/practica.ipynb       
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
    css: custom.css

execute:
  freeze: auto

bibliography: references.bib