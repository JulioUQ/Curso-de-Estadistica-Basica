project:
  type: book
  output-dir: _book
  resources:
    - assets/curso.js   # cuestionarios y progreso (F5.3), cargado por navegacion.html

lang: es

book:
  title: "Estadística Básica"
  author: "Julio Úbeda Quesada"
  date: today
  page-navigation: true
  repo-url: "https://github.com/JulioUQ/Curso-de-Estadistica-Basica"
  repo-actions: [edit, issue]
  sidebar:
    logo: assets/logo.svg
    logo-alt: "Logotipo del curso: histograma con una curva normal"
    collapse-level: 1
  chapters:
    - href: index.qmd
      text: "Inicio"
    - part: "1 Estadística descriptiva"
      chapters:
        - href: notebooks/01_estadistica_descriptiva/teoria.qmd
          text: "Teoría"
        - href: notebooks/01_estadistica_descriptiva/practica.ipynb
          text: "Práctica"
        - href: notebooks/01_estadistica_descriptiva/practica_preprocesamiento.ipynb
          text: "Preprocesamiento"
    - part: "2 Probabilidad"
      chapters:
        - href: notebooks/02_probabilidad/teoria.qmd
          text: "Teoría"
        - href: notebooks/02_probabilidad/practica.ipynb
          text: "Práctica"
    - part: "3 Distribuciones"
      chapters:
        - href: notebooks/03_distribuciones/teoria.qmd
          text: "Teoría"
        - href: notebooks/03_distribuciones/practica.ipynb
          text: "Práctica"
    - part: "4 Inferencia"
      chapters:
        - href: notebooks/04_inferencia/teoria.qmd
          text: "Teoría"
        - href: notebooks/04_inferencia/practica.ipynb
          text: "Práctica"
    - part: "5 Correlación y regresión"
      chapters:
        - href: notebooks/05_regresion/teoria.qmd
          text: "Teoría"
        - href: notebooks/05_regresion/practica.ipynb
          text: "Práctica"
    - part: "6 ANOVA y no paramétricas"
      chapters:
        - href: notebooks/06_anova_chi2/teoria.qmd
          text: "Teoría"
        - href: notebooks/06_anova_chi2/practica.ipynb
          text: "Práctica"
    - part: "Proyecto integrador"
      chapters:
        - href: notebooks/07_proyecto_integrador/practica.ipynb
          text: "Calidad del sueño"
    - href: laboratorio.qmd          # F5.4: experimentos interactivos (sin número)
      text: "Laboratorio estadístico"
  appendices:
    - href: apendices/que_prueba_usar.qmd
      text: "¿Qué prueba usar?"
    - href: apendices/notacion.qmd
      text: "Notación"
    - href: apendices/glosario.qmd
      text: "Glosario"
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
    css: styles.css
    include-after-body: assets/navegacion.html

execute:
  freeze: auto

bibliography: references.bib